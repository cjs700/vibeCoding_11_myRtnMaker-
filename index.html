<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkOut Timer Pro</title>
  <meta name="description" content="커스텀 운동 타이머 앱 - 스테이지별 시간 제한, 타바타, 랩 타임 지원" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">WorkOut Timer <span class="logo-pro">PRO</span></span>
      </div>
      <div class="header-actions">
        <button id="btn-save-routine" class="btn btn-outline" title="루틴 저장">💾 저장</button>
        <button id="btn-load-routine" class="btn btn-outline" title="루틴 불러오기">📂 불러오기</button>
      </div>
    </div>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <main class="app-main">

    <!-- LEFT: Stage List -->
    <section class="panel panel-stages" aria-label="스테이지 목록">
      <div class="panel-header">
        <h2 class="panel-title">스테이지 구성</h2>
        <button id="btn-add-stage" class="btn btn-primary" aria-label="스테이지 추가">+ 추가</button>
      </div>

      <ul id="stage-list" class="stage-list" aria-label="스테이지 리스트">
        <!-- stages rendered here -->
      </ul>

      <div class="stage-empty" id="stage-empty-msg">
        <p>스테이지가 없습니다.<br />＋추가 버튼으로 시작하세요!</p>
      </div>

      <!-- Recommend Scenarios -->
      <div class="recommend-section">
        <h3 class="recommend-title">추천 시나리오</h3>
        <div class="recommend-list">
          <button class="recommend-item" id="rec-1" data-scenario="1">
            <span class="rec-icon">🏃</span>
            <span class="rec-name">인터벌 트레이닝</span>
            <span class="rec-desc">고강도 30초 × 4 + 휴식 15초</span>
          </button>
          <button class="recommend-item" id="rec-2" data-scenario="2">
            <span class="rec-icon">🔥</span>
            <span class="rec-name">타바타</span>
            <span class="rec-desc">20초 운동 / 10초 휴식 × 8세트</span>
          </button>
          <button class="recommend-item" id="rec-3" data-scenario="3">
            <span class="rec-icon">⏱</span>
            <span class="rec-name">랩 타임</span>
            <span class="rec-desc">구간 기록 측정 모드</span>
          </button>
        </div>
      </div>
    </section>

    <!-- RIGHT: Timer Display -->
    <section class="panel panel-timer" aria-label="타이머">
      <div class="timer-status-bar" id="timer-status-bar">
        <span id="status-label" class="status-label">대기 중</span>
        <span id="stage-counter" class="stage-counter">스테이지 0 / 0</span>
      </div>

      <div class="timer-circle-wrap" id="timer-circle-wrap">
        <svg class="timer-svg" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="track" cx="110" cy="110" r="100" />
          <circle class="progress" id="svg-progress" cx="110" cy="110" r="100"
            stroke-dasharray="628.3"
            stroke-dashoffset="0" />
        </svg>
        <div class="timer-center">
          <div id="stage-type-badge" class="stage-type-badge">--</div>
          <div id="timer-display" class="timer-display">00:00</div>
          <div id="lap-count-display" class="lap-count-display"></div>
        </div>
      </div>

      <div id="stage-name-display" class="stage-name-display">스테이지 이름</div>

      <div class="timer-controls">
        <button id="btn-prev" class="ctrl-btn" aria-label="이전 스테이지" title="이전">⏮</button>
        <button id="btn-start-pause" class="ctrl-btn ctrl-main" aria-label="시작/일시정지">▶</button>
        <button id="btn-next-stage" class="ctrl-btn" aria-label="다음 스테이지" title="다음">⏭</button>
        <button id="btn-stop" class="ctrl-btn ctrl-stop" aria-label="정지/초기화" title="정지">■</button>
      </div>
    </section>
  </main>

  <!-- ===== MODAL: Add Stage ===== -->
  <div id="modal-add-stage" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">스테이지 추가</h2>
        <button id="modal-close" class="modal-close-btn" aria-label="모달 닫기">✕</button>
      </div>
      <div class="modal-body">
        <!-- Stage Name -->
        <div class="form-group">
          <label for="input-stage-name">스테이지 이름</label>
          <input type="text" id="input-stage-name" placeholder="예: 스쿼트, 버피, 휴식..." maxlength="30" />
        </div>

        <!-- Stage Type -->
        <div class="form-group">
          <label>스테이지 타입</label>
          <div class="type-selector" role="radiogroup" aria-label="스테이지 타입 선택">
            <button class="type-btn active" data-type="countdown" role="radio" aria-checked="true" id="type-countdown">
              <span class="type-icon">⏳</span>
              <span class="type-name">시간 제한</span>
              <span class="type-desc">Count Down</span>
            </button>
            <button class="type-btn" data-type="tabata" role="radio" aria-checked="false" id="type-tabata">
              <span class="type-icon">🔥</span>
              <span class="type-name">타바타</span>
              <span class="type-desc">Work / Rest 세트</span>
            </button>
            <button class="type-btn" data-type="laptime" role="radio" aria-checked="false" id="type-laptime">
              <span class="type-icon">⏱</span>
              <span class="type-name">랩 타임</span>
              <span class="type-desc">Count Up</span>
            </button>
          </div>
        </div>

        <!-- Countdown Options -->
        <div id="opts-countdown" class="type-options">
          <div class="form-row">
            <div class="form-group">
              <label for="cd-work-time">운동 시간 (초)</label>
              <input type="number" id="cd-work-time" value="30" min="1" max="3600" />
            </div>
            <div class="form-group">
              <label for="cd-rest-time">휴식 시간 (초)</label>
              <input type="number" id="cd-rest-time" value="10" min="0" max="3600" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="cd-wait-time">대기 시간 (초)</label>
              <input type="number" id="cd-wait-time" value="3" min="0" max="60" />
            </div>
          </div>
        </div>

        <!-- Tabata Options -->
        <div id="opts-tabata" class="type-options" hidden>
          <div class="form-row">
            <div class="form-group">
              <label for="tb-work-time">운동 시간 (초)</label>
              <input type="number" id="tb-work-time" value="20" min="1" max="3600" />
            </div>
            <div class="form-group">
              <label for="tb-rest-time">휴식 시간 (초)</label>
              <input type="number" id="tb-rest-time" value="10" min="1" max="3600" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="tb-sets">세트 수</label>
              <input type="number" id="tb-sets" value="8" min="1" max="100" />
            </div>
            <div class="form-group">
              <label for="tb-wait-time">대기 시간 (초)</label>
              <input type="number" id="tb-wait-time" value="3" min="0" max="60" />
            </div>
          </div>
        </div>

        <!-- Lap Time Options -->
        <div id="opts-laptime" class="type-options" hidden>
          <div class="form-row">
            <div class="form-group">
              <label for="lt-laps">랩 수</label>
              <input type="number" id="lt-laps" value="4" min="1" max="100" />
            </div>
            <div class="form-group">
              <label for="lt-wait-time">대기 시간 (초)</label>
              <input type="number" id="lt-wait-time" value="3" min="0" max="60" />
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="modal-cancel" class="btn btn-ghost">취소</button>
        <button id="modal-confirm" class="btn btn-primary">추가하기</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL: Load Routine ===== -->
  <div id="modal-load-routine" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="load-modal-title" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="load-modal-title" class="modal-title">루틴 불러오기</h2>
        <button id="load-modal-close" class="modal-close-btn" aria-label="모달 닫기">✕</button>
      </div>
      <div class="modal-body">
        <ul id="routine-list" class="routine-list">
          <!-- saved routines here -->
        </ul>
        <p id="no-routines-msg" class="no-routines-msg" hidden>저장된 루틴이 없습니다.</p>
      </div>
      <div class="modal-footer">
        <button id="load-modal-cancel" class="btn btn-ghost">닫기</button>
      </div>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
